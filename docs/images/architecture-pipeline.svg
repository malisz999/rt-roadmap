<rect x="80" y="44" width="170" height="56" rx="8" fill="none" fill-opacity="1" stroke="#94A3B8" stroke-width="1.25"/>
<text x="96" y="68" font-weight="600" fill="#1E293B">roadmap.yaml</text>
<text x="96" y="84" font-size="11.5" fill="#64748B">UTF-8, up to 5 MB</text>
<rect x="270" y="44" width="170" height="56" rx="8" fill="none" fill-opacity="1" stroke="#94A3B8" stroke-width="1.25"/>
<text x="286" y="68" font-weight="600" fill="#1E293B">cli.py</text>
<text x="286" y="84" font-size="11.5" fill="#64748B">options, today's date</text>
<rect x="80" y="124" width="360" height="56" rx="8" fill="none" fill-opacity="1" stroke="#94A3B8" stroke-width="1.25"/>
<text x="96" y="148" font-weight="600" fill="#1E293B">1 Load · io.loader</text>
<text x="96" y="164" font-size="11.5" fill="#64748B">YAML 1.2 with positions, NFC strings, E001, E003</text>
<rect x="80" y="220" width="360" height="56" rx="8" fill="none" fill-opacity="1" stroke="#94A3B8" stroke-width="1.25"/>
<text x="96" y="244" font-weight="600" fill="#1E293B">2 Validate · model.build, model.references</text>
<text x="96" y="260" font-size="11.5" fill="#64748B">Partial model, every E0xx collected, deps → seq</text>
<rect x="80" y="304" width="360" height="56" rx="8" fill="none" fill-opacity="1" stroke="#94A3B8" stroke-width="1.25"/>
<text x="96" y="328" font-weight="600" fill="#1E293B">3 Schedule · schedule.scheduler</text>
<text x="96" y="344" font-size="11.5" fill="#64748B">Anchor, earliest start, slot search, delay reasons</text>
<rect x="80" y="388" width="360" height="56" rx="8" fill="none" fill-opacity="1" stroke="#94A3B8" stroke-width="1.25"/>
<text x="96" y="412" font-weight="600" fill="#1E293B">4 Horizon · schedule.horizon</text>
<text x="96" y="428" font-size="11.5" fill="#64748B">Automatic horizon, visible intervals, flags</text>
<rect x="80" y="472" width="360" height="56" rx="8" fill="none" fill-opacity="1" stroke="#94A3B8" stroke-width="1.25"/>
<text x="96" y="496" font-weight="600" fill="#1E293B">5 Colour · color.adjacency, color.dsatur</text>
<text x="96" y="512" font-size="11.5" fill="#64748B">Neighbour graph, DSATUR over a 10-colour palette</text>
<rect x="80" y="556" width="360" height="56" rx="8" fill="none" fill-opacity="1" stroke="#94A3B8" stroke-width="1.25"/>
<text x="96" y="580" font-weight="600" fill="#1E293B">6 Metrics · schedule.load</text>
<text x="96" y="596" font-size="11.5" fill="#64748B">Utilisation and monthly load, rounded half-up</text>
<rect x="80" y="640" width="360" height="56" rx="8" fill="#4F46E5" fill-opacity="0.12" stroke="#4F46E5" stroke-width="2"/>
<text x="96" y="664" font-weight="600" fill="#1E293B">7 Plan · plan.build</text>
<text x="96" y="680" font-size="11.5" fill="#1E293B">Immutable Plan, the only input to rendering (ADR-6)</text>
<rect x="80" y="724" width="170" height="56" rx="8" fill="none" fill-opacity="1" stroke="#94A3B8" stroke-width="1.25"/>
<text x="96" y="748" font-weight="600" fill="#1E293B">plan.serialize</text>
<text x="96" y="764" font-size="11.5" fill="#64748B">Plan → JSON (--plan)</text>
<rect x="270" y="724" width="170" height="56" rx="8" fill="none" fill-opacity="1" stroke="#94A3B8" stroke-width="1.25"/>
<text x="286" y="748" font-weight="600" fill="#1E293B">layout.viewmodel</text>
<text x="286" y="764" font-size="11.5" fill="#64748B">Plan → PageVM, pixels</text>
<rect x="270" y="808" width="170" height="56" rx="8" fill="none" fill-opacity="1" stroke="#94A3B8" stroke-width="1.25"/>
<text x="286" y="832" font-weight="600" fill="#1E293B">render.renderer</text>
<text x="286" y="848" font-size="11.5" fill="#64748B">Jinja2 → HTML string</text>
<rect x="80" y="904" width="360" height="56" rx="8" fill="none" fill-opacity="1" stroke="#94A3B8" stroke-width="1.25"/>
<text x="96" y="928" font-weight="600" fill="#1E293B">io.writer · atomic write</text>
<text x="96" y="944" font-size="11.5" fill="#64748B">plan.json and roadmap.html, UTF-8, LF</text>
<rect x="496" y="124" width="240" height="572" rx="8" fill="none" fill-opacity="1" stroke="#94A3B8" stroke-width="1.25"/>
<text x="512" y="148" font-weight="600" fill="#1E293B">Diagnostics</text>
<text x="512" y="168" font-size="11.5" fill="#64748B">One Collector</text>
<text x="512" y="184" font-size="11.5" fill="#64748B">E0xx and W0xx</text>
<text x="512" y="200" font-size="11.5" fill="#64748B">from every stage,</text>
<text x="512" y="216" font-size="11.5" fill="#64748B">sorted by line</text>
<rect x="496" y="904" width="240" height="56" rx="8" fill="none" fill-opacity="1" stroke="#94A3B8" stroke-width="1.25"/>
<text x="512" y="928" font-weight="600" fill="#1E293B">cli.py</text>
<text x="512" y="944" font-size="11.5" fill="#64748B">stderr, exit code</text>
<text x="268" y="204" font-size="11.5" fill="#64748B">RawDoc</text>
<text x="268" y="294" font-size="11.5" fill="#64748B">ResolvedModel</text>
<text x="268" y="378" font-size="11.5" fill="#64748B">Schedule</text>
<text x="268" y="462" font-size="11.5" fill="#64748B">Horizon, Visibility</text>
<text x="268" y="546" font-size="11.5" fill="#64748B">ColorRef per bar</text>
<text x="268" y="630" font-size="11.5" fill="#64748B">Utilisation, MonthlyLoad</text>
</svg>
