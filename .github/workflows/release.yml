# Release pipeline (ADS 11.3, ADR-12): wheel + sdist, single-file binaries per OS, screenshot review, publish.
# Triggered by pushing a tag v*. Publishing waits for a human to approve the "release" environment after looking
# at the screenshot artifact (RS AT-25, NF-6).
name: release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check . && uv run mypy src
      - run: uv run pytest -q

  dist:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  binaries:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      # Builds rt-<version>-<os>-<arch> and smoke-tests it on the four fixtures.
      - run: uv run --with pyinstaller python tools/build_binary.py --dist binaries
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: binaries/*

  screenshots:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run --with playwright python -m playwright install --with-deps chromium firefox webkit
      # EX, WE, DE in Chromium, Firefox and WebKit, light and dark, plus the A3 print PDF.
      - run: uv run --with playwright python tools/screenshots.py --out screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*

  publish:
    needs: [dist, binaries, screenshots]
    runs-on: ubuntu-latest
    environment: release   # requires manual approval after reviewing the screenshots artifact
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: GitHub release with wheel, sdist and binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          artifacts/dist/* artifacts/binary-*/*
      # PyPI: the distribution name rt-roadmap is still to be confirmed (ADS 13.2); enable once it is.
      # - uses: pypa/gh-action-pypi-publish@release/v1
      #   with:
      #     packages-dir: artifacts/dist
