# Release pipeline (ADS 11.3, ADR-12): wheel + sdist and single-file rt binaries for macOS (arm64), Linux (x86_64)
# and Windows (x86_64).
#   - Push a tag v* (e.g. v1.3.0): everything is built, smoke-tested and attached to a DRAFT GitHub Release.
#     Review it on GitHub, then click "Publish release".
#   - "Run workflow" (workflow_dispatch): the same build, files only (download them from the run's artifacts).
# Binaries are not code-signed: the release notes explain the macOS and Windows first-run warnings.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check . && uv run mypy src
      - run: uv run pytest -q

  dist:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  # Linux: built inside manylinux_2_28 (AlmaLinux 8, glibc 2.28) so the binary runs on most distributions from
  # about 2019 on (RHEL/Alma/Rocky 8+, Debian 11+, Ubuntu 20.04+). uv's own Python is used: it ships the shared
  # libpython that PyInstaller needs (the manylinux interpreters are static).
  linux:
    needs: test
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --with pyinstaller python tools/build_binary.py --dist binaries
      - run: ldd --version | head -1 && file binaries/* || true
      - uses: actions/upload-artifact@v4
        with:
          name: binary-linux-x86_64
          path: binaries/*

  # macOS arm64 and Windows x86_64: native runners.
  binaries:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macos-arm64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      # Builds rt-<version>-<os>-<arch>[.exe] and smoke-tests it: --version and rendering four fixtures.
      - run: uv run --with pyinstaller python tools/build_binary.py --dist binaries
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: binaries/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [dist, linux, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" artifacts/*
          --repo "$GITHUB_REPOSITORY" --draft --verify-tag
          --title "rt ${GITHUB_REF_NAME#v}"
          --notes-file .github/release-notes.md
      # PyPI: the distribution name rt-roadmap is still to be confirmed (ADS 13.2); enable once it is.
      # - uses: pypa/gh-action-pypi-publish@release/v1
      #   with:
      #     packages-dir: artifacts
