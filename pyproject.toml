[project]
name = "rt-roadmap"
version = "1.1.0"
description = "rt — render a YAML roadmap into one self-contained HTML file"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["ruamel.yaml>=0.19.1,<0.20", "Jinja2>=3.1,<4"]

[project.scripts]
rt = "rt.cli:main_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rt"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "lxml>=5",
    "cssselect>=1.2",
    "jsonschema>=4",
    "mypy>=1.10",
    "ruff>=0.6",
    "types-jsonschema",
    "lxml-stubs",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["docs", "scripts", "tools/reference_plan.py", "tools/reference_convert.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Polish letters and typographic dashes are intentional

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["ruamel.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
markers = ["slow: performance tests (RS NF-3, NF-11)"]

[tool.coverage.run]
source = ["rt"]
branch = true
